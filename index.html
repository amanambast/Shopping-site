<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aman Shopping - Online Store</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f3f6;
    color: #222;
}

header {
    background: #131921;
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #ffcc00;
}

.search {
    display: flex;
    flex: 1;
    min-width: 180px;
}

.search input {
    width: 100%;
    padding: 11px;
    border: none;
    outline: none;
    border-radius: 5px 0 0 5px;
}

.search button {
    padding: 11px 15px;
    border: none;
    background: #ffcc00;
    cursor: pointer;
    border-radius: 0 5px 5px 0;
}

.header-btn {
    background: transparent;
    border: 1px solid white;
    color: white;
    padding: 9px;
    border-radius: 5px;
    cursor: pointer;
}

nav {
    display: flex;
    gap: 22px;
    padding: 13px;
    background: #232f3e;
    color: white;
    overflow-x: auto;
}

nav a {
    color: white;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
}

.hero {
    margin: 15px;
    padding: 35px 20px;
    border-radius: 10px;
    background: linear-gradient(120deg, #2874f0, #00c6ff);
    color: white;
    text-align: center;
}

.hero h1 {
    font-size: 30px;
    margin-bottom: 12px;
}

.hero button {
    padding: 11px 20px;
    margin-top: 15px;
    background: #ffcc00;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.section-title {
    padding: 18px 15px 8px;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    padding: 15px;
}

.product {
    background: white;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 2px 6px #00000012;
}

.product img {
    width: 100%;
    height: 140px;
    object-fit: contain;
    margin-bottom: 10px;
}

.product h3 {
    font-size: 15px;
    min-height: 36px;
}

.price {
    font-size: 18px;
    color: #087b36;
    font-weight: bold;
    margin: 10px 0;
}

.product button {
    padding: 9px;
    width: 100%;
    border: none;
    border-radius: 5px;
    background: #ffcc00;
    cursor: pointer;
    font-weight: bold;
    margin-top: 5px;
}

.product button.buy {
    background: #ff9f00;
}

#cart {
    background: white;
    margin: 15px;
    padding: 18px;
    border-radius: 8px;
}

#cartItems {
    margin: 12px 0;
}

.cart-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
}

.cart-row button {
    padding: 5px 9px;
    cursor: pointer;
}

.checkout {
    background: #2874f0;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 5px;
    cursor: pointer;
}

footer {
    margin-top: 25px;
    background: #131921;
    color: white;
    text-align: center;
    padding: 25px;
}

@media (max-width: 650px) {
    header {
        gap: 10px;
    }

    .logo {
        font-size: 19px;
    }

    .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        padding: 9px;
    }

    .product {
        padding: 9px;
    }

    .product img {
        height: 115px;
    }

    .hero h1 {
        font-size: 23px;
    }

    nav {
        gap: 16px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🛒 AMAN MART</div>

    <div class="search">
        <input id="searchInput" type="search"
        placeholder="Search products..."
        oninput="renderProducts()">
        <button onclick="renderProducts()">🔍</button>
    </div>

    <button class="header-btn"
    onclick="document.getElementById('cart').scrollIntoView({behavior:'smooth'})">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<nav>
    <a href="#" onclick="filterCategory('All')">All Products</a>
    <a href="#" onclick="filterCategory('Electronics')">Electronics</a>
    <a href="#" onclick="filterCategory('Fashion')">Fashion</a>
    <a href="#" onclick="filterCategory('Home')">Home</a>
    <a href="#" onclick="filterCategory('Accessories')">Accessories</a>
</nav>

<section class="hero">
    <h1>Welcome to AMAN MART</h1>
    <p>Shop your favourite products at great prices!</p>
    <button onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">
        Shop Now
    </button>
</section>

<h2 class="section-title" id="shop">🔥 Popular Products</h2>

<div class="products" id="productList"></div>

<section id="cart">
    <h2>🛒 Your Shopping Cart</h2>
    <div id="cartItems">Your cart is empty.</div>
    <h3>Total: ₹<span id="cartTotal">0</span></h3>
    <br>
    <button class="checkout" onclick="checkout()">Proceed to Checkout</button>
</section>

<footer>
    <h3>AMAN MART</h3>
    <p>Your online shopping destination.</p>
    <p>Demo shopping website | © 2026</p>
</footer>

<script>
const products = [
    {
        id: 1,
        name: "Wireless Headphones",
        price: 799,
        category: "Electronics",
        image: "https://placehold.co/300x220/e8f0ff/222?text=Headphones"
    },
    {
        id: 2,
        name: "Smart Watch",
        price: 1299,
        category: "Electronics",
        image: "https://placehold.co/300x220/e8f0ff/222?text=Smart+Watch"
    },
    {
        id: 3,
        name: "Running Shoes",
        price: 999,
        category: "Fashion",
        image: "https://placehold.co/300x220/fff0e0/222?text=Shoes"
    },
    {
        id: 4,
        name: "Men's T-Shirt",
        price: 399,
        category: "Fashion",
        image: "https://placehold.co/300x220/e8ffe8/222?text=T-Shirt"
    },
    {
        id: 5,
        name: "Bluetooth Speaker",
        price: 899,
        category: "Electronics",
        image: "https://placehold.co/300x220/eee5ff/222?text=Speaker"
    },
    {
        id: 6,
        name: "Backpack",
        price: 699,
        category: "Accessories",
        image: "https://placehold.co/300x220/fff0e0/222?text=Backpack"
    },
    {
        id: 7,
        name: "Table Lamp",
        price: 499,
        category: "Home",
        image: "https://placehold.co/300x220/fff7d6/222?text=Lamp"
    },
    {
        id: 8,
        name: "Mobile Phone",
        price: 8999,
        category: "Electronics",
        image: "https://placehold.co/300x220/e8f0ff/222?text=Mobile"
    }
];

let cart = JSON.parse(localStorage.getItem("amanCart") || "[]");
let selectedCategory = "All";

function renderProducts() {
    const query = document.getElementById("searchInput")
        .value.toLowerCase();

    const filtered = products.filter(product => {
        const matchesName = product.name.toLowerCase().includes(query);
        const matchesCategory =
            selectedCategory === "All" ||
            product.category === selectedCategory;

        return matchesName && matchesCategory;
    });

    const list = document.getElementById("productList");

    if (filtered.length === 0) {
        list.innerHTML = "<p>No products found.</p>";
        return;
    }

    list.innerHTML = filtered.map(product => `
        <div class="product">
            <img src="${product.image}"
                 alt="${product.name}"
                 loading="lazy">
            <h3>${product.name}</h3>
            <p class="price">₹${product.price.toLocaleString("en-IN")}</p>
            <button onclick="addToCart(${product.id})">
                Add to Cart
            </button>
            <button class="buy" onclick="buyNow(${product.id})">
                Buy Now
            </button>
        </div>
    `).join("");
}

function filterCategory(category) {
    selectedCategory = category;
    renderProducts();
    document.getElementById("shop")
        .scrollIntoView({behavior:"smooth"});
}

function saveCart() {
    localStorage.setItem("amanCart", JSON.stringify(cart));
}

function addToCart(id) {
    const product = products.find(p => p.id === id);
    const existing = cart.find(item => item.id === id);

    if (existing) {
        existing.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }

    saveCart();
    renderCart();
    alert(product.name + " added to cart!");
}

function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    saveCart();
    renderCart();
}

function changeQuantity(id, amount) {
    const item = cart.find(p => p.id === id);
    if (!item) return;

    item.quantity += amount;

    if (item.quantity <= 0) {
        removeFromCart(id);
        return;
    }

    saveCart();
    renderCart();
}

function renderCart() {
    const container = document.getElementById("cartItems");
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    const total = cart.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
    );

    document.getElementById("cartCount").textContent = count;
    document.getElementById("cartTotal").textContent =
        total.toLocaleString("en-IN");

    if (cart.length === 0) {
        container.textContent = "Your cart is empty.";
        return;
    }

    container.innerHTML = cart.map(item => `
        <div class="cart-row">
            <div>
                <strong>${item.name}</strong><br>
                ₹${item.price.toLocaleString("en-IN")} × ${item.quantity}
            </div>
            <div>
                <button onclick="changeQuantity(${item.id}, -1)">−</button>
                <button onclick="changeQuantity(${item.id}, 1)">+</button>
                <button onclick="removeFromCart(${item.id})">Remove</button>
            </div>
        </div>
    `).join("");
}

function buyNow(id) {
    addToCart(id);
    document.getElementById("cart")
        .scrollIntoView({behavior:"smooth"});
}

function checkout() {
    if (cart.length === 0) {
        alert("Please add products to your cart first.");
        return;
    }

    alert(
        "This is a demo shopping website. " +
        "Real orders and payments are not enabled yet."
    );
}

renderProducts();
renderCart();
</script>

</body>
</html>
